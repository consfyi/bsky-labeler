[package]
name = "bsky-labeler"
version = "0.1.0"
edition = "2024"
default-run = "bsky-labeler"

[dependencies]
anyhow = "1"
atrium-api = "0.25"
atrium-crypto = "0.1"
atrium-xrpc-client = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["query"] }
config = "0.15"
env_logger = "0.11"
futures = "0.3"
ipld-core = { version = "0.4", features = ["serde"] }
log = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
minicbor = { version = "1", features = ["alloc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1", features = ["full"] }
